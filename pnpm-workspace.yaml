packages:
  - 'apps/**'
  - 'packages/**'
  - 'test/**'
  - 'e2e'

allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  core-js: false
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

overrides:
  # @prisma/instrumentation 6 accepts any 0.x instrumentation; the latest needs @opentelemetry/api 1.10.
  # Keep it on the same OpenTelemetry release as the rest of apps/server (see docs/observability.md).
  '@prisma/instrumentation>@opentelemetry/instrumentation': 0.220.0
