services:
  # Local smoke test of the production image. For the full production stack see deploy/docker-compose.prod.yml.
  app:
    profiles: [app]
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=public"
    env_file:
      - path: .env
        required: false
    volumes:
      - uploads:/data/uploads

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg16
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_DB: "${DATABASE_NAME}"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
  uploads:
